<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Діагностика мислення | Іра Анк — Unlocking коуч</title>
<meta name="description" content="Безкоштовна діагностика мислення для підприємців. Дізнайся, що блокує твій потенціал за 3 хвилини.">
<meta property="og:title" content="Діагностика мислення — Unlocking">
<meta property="og:description" content="Що блокує твій потенціал? 3 хвилини — і ти дізнаєшся.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   ACOUSTIC PRECISION — Design System
   ═══════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  /* Emerald — organic, not neon */
  --em:#1B8C6A;--em-soft:rgba(27,140,106,0.12);--em-glow:rgba(27,140,106,0.25);--em-bright:#2AAE82;
  /* Gold — whispered, not shouted */
  --au:#C9A84C;--au-soft:rgba(201,168,76,0.10);--au-glow:rgba(201,168,76,0.20);--au-line:rgba(201,168,76,0.35);
  /* Surfaces — warm blacks */
  --void:#09090B;--surface:#111113;--raised:#19191D;--border:rgba(255,255,255,0.06);--border-h:rgba(255,255,255,0.10);
  /* Text */
  --ink:#E8E5DF;--ink2:#8A8680;--ink3:#5A5752;
  /* Signals */
  --sig-green:#3DA87A;--sig-yellow:#C9A84C;--sig-orange:#C47A3A;--sig-red:#B84A4A;
  /* Type */
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'DM Sans',-apple-system,system-ui,sans-serif;
}

html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--sans);background:var(--void);color:var(--ink);
  min-height:100dvh;overflow-x:hidden;font-size:15px;line-height:1.55;
}

/* Film grain overlay */
body::before{
  content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;
  opacity:0.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}

/* ── Layout ── */
.shell{max-width:480px;margin:0 auto;padding:24px 20px;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* ── Progress — gold resonance line ── */
.prog{position:fixed;top:0;left:0;right:0;z-index:50;height:2px;background:var(--border)}
.prog-fill{height:100%;background:var(--au);transition:width .6s cubic-bezier(.25,.46,.45,.94);position:relative}
.prog-fill::after{
  content:'';position:absolute;right:-4px;top:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--au);
  box-shadow:0 0 12px var(--au-glow),0 0 4px var(--au);
  transition:opacity .3s;
}
.prog-meta{
  position:fixed;top:10px;right:20px;z-index:51;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  font-family:var(--sans);font-weight:600;
  transition:opacity .4s;
}
.prog-step{
  position:fixed;top:10px;left:20px;z-index:51;
  font-size:10px;letter-spacing:.08em;color:var(--au);
  font-family:var(--sans);font-weight:600;
  opacity:0.7;transition:opacity .4s;
}
.prog-hidden{opacity:0;pointer-events:none}

/* ── Screens ── */
.scr{
  display:none;flex:1;flex-direction:column;justify-content:center;
  padding-top:32px;padding-bottom:24px;
  opacity:0;transform:translateY(16px);
}
.scr.on{display:flex;animation:arrive .5s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes arrive{to{opacity:1;transform:translateY(0)}}

/* ── Typography ── */
.t-display{
  font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.25;
  letter-spacing:-.01em;color:var(--ink);margin-bottom:12px;
}
.t-display em{font-style:italic;color:var(--em-bright)}
.t-question{
  font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.3;
  color:var(--ink);margin-bottom:8px;letter-spacing:-.005em;
}
.t-body{font-size:14px;color:var(--ink2);line-height:1.6;margin-bottom:20px}
.t-micro{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.t-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ── Whisper bubble ── */
.whisper{
  padding:14px 18px;margin-bottom:24px;
  font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.5;color:var(--ink2);
  border-left:2px solid var(--au-line);
  max-width:90%;
}

/* ── Section tag ── */
.tag{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:100px;
  background:var(--au-soft);color:var(--au);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  margin-bottom:16px;
}
.tag::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--au);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Subtech line ── */
.subtech{font-size:12px;color:var(--em);margin-bottom:16px;font-weight:500;opacity:.8}

/* ── Option cards ── */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.o{
  position:relative;
  background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  padding:14px 16px 14px 44px;
  font-size:14px;line-height:1.45;color:var(--ink);
  cursor:pointer;transition:all .25s cubic-bezier(.25,.46,.45,.94);
  user-select:none;
}
.o::before{
  content:'';position:absolute;left:16px;top:17px;
  width:10px;height:10px;border-radius:50%;
  border:1.5px solid var(--border-h);
  transition:all .25s;
}
.o:hover{border-color:var(--border-h);background:var(--raised)}
.o.on{
  border-color:var(--em);background:var(--em-soft);
  box-shadow:0 0 0 1px var(--em),inset 0 1px 0 rgba(255,255,255,0.03);
}
.o.on::before{background:var(--em);border-color:var(--em);box-shadow:0 0 8px var(--em-glow)}

/* Severity dot override */
.o[data-sev="0"]::before{border-color:var(--sig-green)}
.o[data-sev="1"]::before{border-color:var(--sig-yellow)}
.o[data-sev="2"]::before{border-color:var(--sig-orange)}
.o[data-sev="3"]::before,.o[data-sev="4"]::before{border-color:var(--sig-red)}
.o.on[data-sev="0"]::before{background:var(--sig-green);box-shadow:0 0 8px rgba(61,168,122,.3)}
.o.on[data-sev="1"]::before{background:var(--sig-yellow);box-shadow:0 0 8px rgba(201,168,76,.3)}
.o.on[data-sev="2"]::before{background:var(--sig-orange);box-shadow:0 0 8px rgba(196,122,58,.3)}
.o.on[data-sev="3"]::before,.o.on[data-sev="4"]::before{background:var(--sig-red);box-shadow:0 0 8px rgba(184,74,74,.3)}

/* Multi-select */
.o.multi::before{border-radius:3px;width:12px;height:12px;top:16px;left:15px}
.o.multi.on::before{
  background:var(--em);border-color:var(--em);
  /* checkmark via box shadow trick */
}
.ctr{text-align:center;font-size:12px;color:var(--au);margin-bottom:12px;font-weight:500;letter-spacing:.03em}

/* ── Buttons ── */
.btn{
  display:block;width:100%;padding:15px 24px;
  border:none;border-radius:8px;
  font-family:var(--sans);font-size:15px;font-weight:600;
  cursor:pointer;transition:all .25s;text-align:center;
  position:relative;overflow:hidden;
}
.btn-em{
  background:var(--em);color:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 0 24px var(--em-glow);
}
.btn-em:hover{box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 32px var(--em-glow);transform:translateY(-1px)}
.btn-au{
  background:linear-gradient(135deg,var(--au),#B8963F);color:#111;
  box-shadow:0 1px 2px rgba(0,0,0,.3),0 0 24px var(--au-glow);
}
.btn-au:hover{box-shadow:0 2px 8px rgba(0,0,0,.4),0 0 32px var(--au-glow);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:default;transform:none!important;box-shadow:none!important}
.btn-ghost{
  background:none;border:none;color:var(--ink3);font-size:12px;
  cursor:pointer;padding:10px 0;margin-top:4px;font-family:var(--sans);
  letter-spacing:.02em;transition:color .2s;
}
.btn-ghost:hover{color:var(--ink2)}

/* ── Insight card ── */
.insight-card{
  background:var(--em-soft);
  border:1px solid rgba(27,140,106,0.15);border-radius:10px;
  padding:16px 18px;margin-bottom:20px;
}
.insight-card .ic-label{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--em);font-weight:600;margin-bottom:8px;
}
.insight-card .ic-body{font-size:13px;line-height:1.65;color:var(--ink)}

/* ── Warning card ── */
.warn-card{
  background:var(--au-soft);
  border:1px solid rgba(201,168,76,0.15);border-radius:10px;
  padding:16px 18px;margin-bottom:20px;
}
.warn-card .wc-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--au);font-weight:600;margin-bottom:8px}
.warn-card .wc-body{font-size:13px;line-height:1.65;color:var(--ink)}

/* ── Data card ── */
.data-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:4px 0;margin-bottom:20px;overflow:hidden;
}
.d-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 18px;border-bottom:1px solid var(--border);
}
.d-row:last-child{border:none}
.d-row .dk{font-size:13px;color:var(--ink2)}
.d-row .dv{font-size:16px;font-weight:700;font-family:var(--serif)}

/* ── Score visualization — frequency wave ── */
.freq-wrap{text-align:center;margin-bottom:24px;padding:20px 0}
.freq-bars{
  display:flex;justify-content:center;align-items:end;gap:3px;
  height:80px;margin-bottom:16px;
}
.freq-bar{
  width:4px;border-radius:2px;
  transition:height .8s cubic-bezier(.25,.46,.45,.94),background .5s;
  animation:freq-in .6s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes freq-in{from{height:4px!important;opacity:0}to{opacity:1}}
.freq-score{
  font-family:var(--serif);font-size:48px;font-weight:700;line-height:1;
  margin-bottom:4px;
}
.freq-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink3);font-weight:600}

/* ── Metrics row ── */
.mets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.met{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:14px 10px;text-align:center;
}
.met-v{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1;margin-bottom:4px}
.met-l{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600;line-height:1.3}

/* ── Badge ── */
.badge{
  display:inline-block;padding:5px 14px;border-radius:100px;
  font-size:11px;font-weight:600;letter-spacing:.04em;
}

/* ── Shock number ── */
.shock{
  font-family:var(--serif);font-size:72px;font-weight:700;
  text-align:center;line-height:1;margin:24px 0 8px;
  animation:shock-in .8s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes shock-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.shock-sub{text-align:center;font-size:15px;color:var(--ink2);margin-bottom:28px;font-family:var(--serif)}

/* ── Impact list ── */
.imp{display:flex;gap:14px;align-items:flex-start;padding:10px 0;font-size:13px;line-height:1.55}
.imp-dot{
  width:6px;height:6px;border-radius:50%;background:var(--sig-red);
  flex-shrink:0;margin-top:6px;opacity:.6;
}

/* ── Promise list ── */
.promise{padding:10px 0;font-size:14px;line-height:1.5;display:flex;gap:12px;align-items:flex-start}
.promise-em{font-size:18px;flex-shrink:0}

/* ── Form ── */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:6px}
.field input{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;padding:13px 16px;color:var(--ink);
  font-family:var(--sans);font-size:14px;outline:none;
  transition:border .25s,box-shadow .25s;
}
.field input:focus{border-color:var(--em);box-shadow:0 0 0 3px var(--em-soft)}
.field input::placeholder{color:var(--ink3)}

/* ── Thank you ── */
.ty-mark{
  width:64px;height:64px;margin:0 auto 20px;
  border-radius:50%;border:2px solid var(--em);
  display:flex;align-items:center;justify-content:center;
  color:var(--em);font-size:28px;
  box-shadow:0 0 24px var(--em-glow);
  animation:ty-in .6s cubic-bezier(.22,.61,.36,1) both;
}
@keyframes ty-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

/* ── Decorative elements ── */
.divider{
  width:40px;height:1px;background:var(--au-line);margin:20px 0;
}
.divider-c{margin-left:auto;margin-right:auto}

/* ── Responsive ── */
@media(max-width:380px){
  .t-display{font-size:22px}
  .t-question{font-size:19px}
  .freq-score{font-size:40px}
  .shock{font-size:56px}
}
</style>
</head>

<div class="prog-step prog-hidden" id="progStep"></div>

<!-- App -->
<div class="shell" id="app"></div>

<script>

// Quiz Engine

let cur = 0;
const ans = {};
const total = screens.length;
const app = document.getElementById('app');

function save(){try{localStorage.setItem('quiz_u',JSON.stringify({cur,ans}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('quiz_u'));if(d&&d.cur){cur=d.cur;Object.assign(ans,d.ans);return true}}catch(e){}return false}

function calcScore(){
  let s=0,c=0;
  ['q1','q2','q4','q6','q7'].forEach(k=>{if(ans[k]!==undefined){s+=ans[k];c++}});
  const raw=c?s/c:0;
  return Math.round(Math.min(10,raw*2.5)*10)/10;
}

function calcMetrics(){
  const q3c=ans.q3?ans.q3.length:0;
  const q5c=ans.q5?ans.q5.length:0;
  return{
    blocks:Math.min(100,Math.round((q3c/8)*100)),
    zones:Math.min(100,Math.round((q5c/6)*100)),
    clarity:Math.max(0,100-Math.round(((ans.q6||0)+(ans.q7||0))/6*100))
  };
}

function getCat(s){
  if(s<=2.5)return{n:'Потенціал розблоковано',c:'var(--sig-green)',bg:'rgba(61,168,122,.12)'};
  if(s<=5)return{n:'Часткове блокування',c:'var(--sig-yellow)',bg:'rgba(201,168,76,.12)'};
  if(s<=7.5)return{n:'Суттєве блокування',c:'var(--sig-orange)',bg:'rgba(196,122,58,.12)'};
  return{n:'Критичне блокування',c:'var(--sig-red)',bg:'rgba(184,74,74,.12)'};
}

function getHrs(){
  const o=screens[3].options.find(o=>o.value===ans.q2);
  return o?o.hours:15;
}

function updProg(){
  const pct=Math.round((cur/total)*100);
  document.getElementById('progFill').style.width=pct+'%';
  const s=screens[cur];
  const stepEl=document.getElementById('progStep');
  const metaEl=document.getElementById('progMeta');
  const hide=cur===0||cur>=total-1;
  stepEl.className='prog-step'+(hide?' prog-hidden':'');
  metaEl.className='prog-meta'+(hide?' prog-hidden':'');
  if(s&&s.step){stepEl.textContent=s.step;metaEl.textContent=s.section||''}
  else if(s&&s.section){stepEl.textContent='';metaEl.textContent=s.section}
  else{stepEl.textContent='';metaEl.textContent=''}
}

function go(n){cur=n;save();render();}

function pickOne(id,val){
  ans[id]=val;
  save();
  setTimeout(()=>go(cur+1),200);
}

function pickMulti(id,idx){
  if(!ans[id]) ans[id]=[];
  const i=ans[id].indexOf(idx);
  if(i===-1) ans[id].push(idx);
  else ans[id].splice(i,1);
  save();render();
}

function submitForm(e){
  e.preventDefault();
  const form=document.getElementById('qf');
  const data=new FormData(form);
  const btn=document.getElementById('subBtn');
  btn.disabled=true;btn.textContent='Надсилаю...';
  fetch('https://api.web3forms.com/submit',{method:'POST',body:data})
    .then(r=>r.json()).then(()=>go(cur+1))
    .catch(()=>go(cur+1));
}
